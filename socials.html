<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Socials & Connect — Hitashri Dinesh Sankhe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-pink: #FFA5C6;
      --c-yellow: #FFDF7D;
      --c-lime: #F2FFAA;
      --c-periwinkle: #A5ACE3;
      --c-sky: #73E3FF;

      --desk-bg: #FCFAF7;
      --desk-dot: #E8DECF;
      --sheet-bg: #FFFFFF;
      --text-main: #2D2727;
      --text-muted: #665D5D;
      --border-soft: #EFE6DA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--desk-bg);
      background-image:
        radial-gradient(circle at 15% 20%, rgba(165, 172, 227, 0.35) 0%, transparent 40%),
        radial-gradient(circle at 85% 70%, rgba(255, 165, 198, 0.3) 0%, transparent 40%),
        radial-gradient(var(--desk-dot) 1.5px, transparent 1.5px);
      background-size: 100% 100%, 100% 100%, 28px 28px;
      color: var(--text-main);
      line-height: 1.6;
      padding: 40px 24px 64px;
      min-height: 100vh;
    }
    .container { max-width: 960px; margin: 0 auto; }
    .top-nav { margin-bottom: 28px; }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.9rem;
      background: #FFFFFF;
      border: 1.5px solid var(--c-periwinkle);
      padding: 8px 20px;
      border-radius: 24px;
      box-shadow: 0 4px 12px rgba(165, 172, 227, 0.15);
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      transform: translateX(-3px);
      background: var(--c-periwinkle);
      color: #FFFFFF;
    }
    .page-sheet {
      background: var(--sheet-bg);
      border: 2px solid var(--border-soft);
      border-radius: 28px;
      padding: 44px 38px;
      box-shadow: 0 16px 36px rgba(165, 172, 227, 0.1);
      position: relative;
    }
    .sheet-pin {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      position: absolute;
      top: 18px;
      left: 24px;
      background: var(--c-periwinkle);
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .tag-badge {
      display: inline-block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--c-periwinkle);
      padding: 5px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 2.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    h1 span {
      font-family: 'Caveat', cursive;
      font-size: 2.9rem;
      color: #6C74BF;
    }
    .subhead {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .social-card {
      background: #FFFFFF;
      border: 2px solid var(--border-soft);
      border-radius: 20px;
      padding: 24px;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 6px 18px rgba(165, 172, 227, 0.08);
      transition: all 0.25s ease;
    }
    .social-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 28px rgba(165, 172, 227, 0.2);
      border-color: var(--c-periwinkle);
    }

    .icon-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-box svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .box-ig { background: #FFE8F0; color: #E1306C; }
    .box-fb { background: #E7F0FD; color: #1877F2; }
    .box-li { background: #EAEBF9; color: #0A66C2; }
    .box-ml { background: #FFF7D6; color: #B28310; }

    .social-info h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .social-info p {
      font-size: 0.86rem;
      color: var(--text-muted);
    }
  </style>
</head>
